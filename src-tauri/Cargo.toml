[package]
name = "dockforge"
version = "0.4.1"
description = "An open-source, themeable dock for Windows"
authors = ["DockForge contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "dockforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
png = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
