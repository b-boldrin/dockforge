name: Release

# Builds the Windows installer and a portable .zip, and publishes them on the Releases page.
# Runs when a tag like v0.4.0 is pushed, or by hand from the Actions tab for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:TAG) { throw "A tag $env:TAG não bate com a versão $v do tauri.conf.json" }

      - name: Build
        run: npx tauri build --ci

      - name: Package
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory out, portable | Out-Null
          Copy-Item (Get-Item src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1) "out/DockForge_${v}_setup_x64.exe"
          Copy-Item (Get-Item src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1) "out/DockForge_${v}_x64.msi"
          Copy-Item src-tauri/target/release/dockforge.exe portable/DockForge.exe
          Copy-Item LICENSE portable/LICENSE.txt
          Compress-Archive -Path portable/* -DestinationPath "out/DockForge_${v}_portable_x64.zip"
          Get-ChildItem out

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG (Get-ChildItem out).FullName --clobber
          } else {
            gh release create $env:TAG (Get-ChildItem out).FullName --title "DockForge $env:TAG" --generate-notes
          }
