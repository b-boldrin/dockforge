name: Release

# Publishes the Windows installer, an MSI and a portable .zip on the Releases page.
# It runs on every push to main, but only builds when the app version (tauri.conf.json) has no
# release yet: bumping the version is all it takes to ship one. It can also be run by hand from
# the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$tag já tem release; nada a fazer."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Build
        run: npx tauri build --ci

      - name: Package
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory out, portable | Out-Null
          Copy-Item (Get-Item src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1) "out/DockForge_${v}_setup_x64.exe"
          Copy-Item (Get-Item src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1) "out/DockForge_${v}_x64.msi"
          Copy-Item src-tauri/target/release/dockforge.exe portable/DockForge.exe
          Copy-Item LICENSE portable/LICENSE.txt
          Compress-Archive -Path portable/* -DestinationPath "out/DockForge_${v}_portable_x64.zip"
          Get-ChildItem out

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG (Get-ChildItem out).FullName --target $env:GITHUB_SHA --title "DockForge $env:TAG" --generate-notes
